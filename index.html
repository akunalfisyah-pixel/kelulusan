<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pengumuman Kelulusan - Carnegie School</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Poppins', sans-serif;
}

body {
  overflow: hidden;
  color: #0b1d26;
}

/* VIDEO BACKGROUND */
.video-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
}

.video-bg video {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/* GLASS CARD */
.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0.9);
  width: 90%;
  max-width: 420px;
  padding: 30px;
  border-radius: 20px;

  background: rgba(255,255,255,0.15);
  backdrop-filter: blur(20px);
  box-shadow: 0 10px 50px rgba(0,0,0,0.5);
  border: 1px solid rgba(255, 215, 0, 0.3);

  text-align: center;
  animation: fadeIn 1s ease forwards;
}

@keyframes fadeIn {
  to {
    transform: translate(-50%, -50%) scale(1);
    opacity: 1;
  }
}

h1 { font-size: 24px; color: #0b1d26; }
h2 { font-weight: 400; margin-bottom: 20px; color: #123; }

/* INPUT */
input {
  width: 100%;
  padding: 12px;
  border-radius: 10px;
  border: none;
  margin-bottom: 12px;
  font-size: 16px;
}

/* ✨ BUTTON BIRU + GOLD */
button {
  width: 100%;
  padding: 12px;
  border-radius: 999px;
  border: none;

  background: linear-gradient(
    135deg,
    #2a6f97 0%,
    #4ea8de 40%,
    #d4af37 70%,
    #caa22c 100%
  );

  color: #0b1d26;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;

  box-shadow: 
    0 6px 18px rgba(0, 0, 0, 0.25),
    0 0 12px rgba(212, 175, 55, 0.5);

  transition: all 0.3s ease;
}

button:hover {
  transform: translateY(-2px) scale(1.03);

  box-shadow: 
    0 10px 25px rgba(0,0,0,0.3),
    0 0 18px rgba(255, 215, 0, 0.8);
}

/* RESULT */
.result {
  margin-top: 20px;
  font-size: 20px;
  opacity: 0;
  transform: translateY(20px);
  transition: 0.5s;
}

.show {
  opacity: 1;
  transform: translateY(0);
}

.lulus { color: #0a7f5a; }
.tidak { color: #b00020; }

/* CONFETTI */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: 0;
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(100vh) rotate(720deg);
  }
}
</style>
</head>

<body>

<!-- VIDEO -->
<div class="video-bg">
  <video autoplay muted loop>
    <source src="https://cdn.coverr.co/videos/coverr-clouds-moving-in-the-sky-1560/1080p.mp4" type="video/mp4">
  </video>
</div>

<!-- SOUND -->
<audio id="sound" src="https://www.soundjay.com/human/applause-01.mp3"></audio>

<div class="container">
  <h1>Pengumuman Kelulusan</h1>
  <h2>Carnegie School</h2>

  <p>Masukkan Nama & Tanggal Lahir</p>

  <input type="text" id="nama" placeholder="Nama Lengkap">
  <input type="date" id="tgl">

  <button onclick="cekKelulusan()">Cek Kelulusan</button>

  <div id="hasil" class="result"></div>
</div>

<script>
const dataSiswa = [
  { nama: "ALBERTH FARRELL HARTIMIN", tgl: "2009-02-06" },
  { nama: "ANGELICA SALIM", tgl: "2008-01-30" },
  { nama: "BERLYN ANGGIE", tgl: "2008-05-07" },
  { nama: "CALLISTA", tgl: "2008-02-16" },
  { nama: "CHERYN VALARIE", tgl: "2008-03-01" },
  { nama: "CHRISTOPHER ETHAN WIDJAJA", tgl: "2008-10-10" },
  { nama: "DOVIN COLLIN TANEAN", tgl: "2008-08-19" },
  { nama: "EDBERT", tgl: "2008-08-31" },
  { nama: "EDELINE WISELY", tgl: "2008-11-11" },
  { nama: "EVELYN CAUTIE", tgl: "2008-07-24" },
  { nama: "JASON", tgl: "2008-08-17" },
  { nama: "JESSILYN GABRIEL WIJAYA", tgl: "2009-02-26" },
  { nama: "JOEY YANG", tgl: "2008-04-28" },
  { nama: "KALISIA ANGITA", tgl: "2008-08-08" },
  { nama: "KELLY ROSELYN CHANDRA", tgl: "2008-06-11" },
  { nama: "KENT LORRENZO HALIM", tgl: "2007-11-22" },
  { nama: "NICHOLAS ETHAN AUDRIS", tgl: "2008-10-23" },
  { nama: "RICHARD LINARDY", tgl: "2008-05-27" },
  { nama: "TANU JAYREEN REEVE", tgl: "2008-06-26" },
  { nama: "VANESSA MADELINE CLAIRE", tgl: "2008-08-05" },
  { nama: "VARREN ADDISON MANIK", tgl: "2008-04-29" },
  { nama: "CELINE WIJAYA", tgl: "2008-05-10" }
];

function cekKelulusan() {
  let namaInput = document.getElementById("nama").value.trim().toUpperCase();
  let tglInput = document.getElementById("tgl").value;
  let hasil = document.getElementById("hasil");

  let siswa = dataSiswa.find(
    s => s.nama === namaInput && s.tgl === tglInput
  );

  if (siswa) {
    hasil.innerHTML = `🎉 SELAMAT <b>${siswa.nama}</b><br>ANDA DINYATAKAN <span class='lulus'>LULUS</span>`;
    document.getElementById("sound").play();
    confettiEffect();
  } else {
    hasil.innerHTML = "❌ Data tidak cocok / tidak ditemukan";
  }

  hasil.classList.add("show");
}

/* CONFETTI */
function confettiEffect() {
  for (let i = 0; i < 80; i++) {
    let c = document.createElement("div");
    c.classList.add("confetti");
    document.body.appendChild(c);

    c.style.left = Math.random() * window.innerWidth + "px";
    c.style.background = `hsl(${Math.random()*360},100%,50%)`;
    c.style.animationDuration = (Math.random() * 3 + 2) + "s";

    setTimeout(() => c.remove(), 5000);
  }
}
</script>

</body>
</html>
